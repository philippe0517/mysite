<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D乒乓球对战 · 奥运决赛 | 于哲的个人主页</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237EB6D9'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #0a1628;
      overflow: hidden;
      color: #fff;
    }

    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: none;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    /* 记分牌 - 奥运风格 */
    .scoreboard {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 0;
      background: linear-gradient(180deg, #1a2a4a 0%, #0d1a30 100%);
      border: 2px solid #c9a96e;
      border-radius: 12px;
      padding: 12px 28px;
      box-shadow: 0 4px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
    }

    .score-side {
      text-align: center;
      min-width: 100px;
      padding: 0 16px;
    }

    .score-label {
      font-size: 12px;
      color: #c9a96e;
      margin-bottom: 4px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .score-value {
      font-size: 48px;
      font-weight: 900;
      color: #fff;
      line-height: 1;
      font-family: 'Noto Sans SC', sans-serif;
      text-shadow: 0 2px 10px rgba(201,169,110,0.5);
    }

    .score-divider {
      font-size: 32px;
      color: #c9a96e;
      font-weight: 300;
      padding: 0 8px;
    }

    .game-info {
      position: absolute;
      top: 24px;
      left: 24px;
      background: linear-gradient(180deg, rgba(26,42,74,0.9) 0%, rgba(13,26,48,0.9) 100%);
      border: 1px solid rgba(201,169,110,0.5);
      padding: 12px 18px;
      border-radius: 10px;
      backdrop-filter: blur(10px);
    }

    .game-info h2 {
      font-size: 14px;
      color: #c9a96e;
      margin-bottom: 2px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .game-info p {
      font-size: 11px;
      color: rgba(255,255,255,0.6);
      line-height: 1.5;
    }

    .difficulty {
      position: absolute;
      top: 24px;
      right: 24px;
      display: flex;
      gap: 6px;
      pointer-events: auto;
    }

    .diff-btn {
      padding: 8px 16px;
      border: 1px solid rgba(201,169,110,0.4);
      background: rgba(26,42,74,0.8);
      color: rgba(255,255,255,0.6);
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .diff-btn:hover {
      background: rgba(201,169,110,0.2);
      color: #c9a96e;
    }

    .diff-btn.active {
      background: #c9a96e;
      color: #0d1a30;
      border-color: #c9a96e;
    }

    /* 蓄力条 */
    .power-bar-container {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .power-bar-container.active {
      opacity: 1;
    }

    .power-bar-label {
      text-align: center;
      font-size: 12px;
      color: #c9a96e;
      margin-bottom: 6px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .power-bar {
      width: 100%;
      height: 14px;
      background: rgba(13,26,48,0.8);
      border: 2px solid #c9a96e;
      border-radius: 7px;
      overflow: hidden;
    }

    .power-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4ade80 0%, #facc15 50%, #ef4444 100%);
      transition: width 0.05s linear;
      border-radius: 5px;
    }

    .center-message {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    .center-message.show {
      opacity: 1;
    }

    .center-message h1 {
      font-size: 64px;
      color: #c9a96e;
      font-weight: 900;
      margin-bottom: 12px;
      text-shadow: 0 4px 30px rgba(201,169,110,0.5);
      letter-spacing: 4px;
    }

    .center-message p {
      font-size: 20px;
      color: rgba(255,255,255,0.8);
      letter-spacing: 2px;
    }

    .controls-hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(13,26,48,0.85);
      border: 1px solid rgba(201,169,110,0.4);
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 12px;
      color: rgba(255,255,255,0.7);
      text-align: center;
      line-height: 1.8;
      backdrop-filter: blur(10px);
    }

    .controls-hint strong {
      color: #c9a96e;
      font-weight: 700;
    }

    /* 开始界面 - 奥运风格 */
    .start-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at center, #1a2a4a 0%, #0a1628 70%, #050d1a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .start-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .olympic-rings {
      display: flex;
      gap: -8px;
      margin-bottom: 30px;
    }

    .ring {
      width: 50px;
      height: 50px;
      border: 5px solid;
      border-radius: 50%;
      margin: 0 -8px;
    }

    .ring:nth-child(1) { border-color: #0085C7; }
    .ring:nth-child(2) { border-color: #000000; margin-top: 25px; }
    .ring:nth-child(3) { border-color: #DF0024; }
    .ring:nth-child(4) { border-color: #F4C300; margin-top: 25px; }
    .ring:nth-child(5) { border-color: #009F3D; }

    .start-screen h1 {
      font-size: 56px;
      color: #c9a96e;
      font-weight: 900;
      margin-bottom: 8px;
      text-shadow: 0 4px 30px rgba(201,169,110,0.4);
      letter-spacing: 6px;
    }

    .start-screen .subtitle {
      font-size: 18px;
      color: rgba(255,255,255,0.6);
      margin-bottom: 50px;
      letter-spacing: 4px;
    }

    .start-screen .match-info {
      font-size: 14px;
      color: rgba(255,255,255,0.5);
      margin-bottom: 40px;
      letter-spacing: 2px;
      text-align: center;
      line-height: 2;
    }

    .start-screen .match-info strong {
      color: #c9a96e;
    }

    .start-difficulty {
      display: flex;
      gap: 16px;
      margin-bottom: 40px;
    }

    .start-diff-btn {
      padding: 14px 36px;
      font-size: 16px;
      font-weight: 600;
      color: rgba(255,255,255,0.6);
      background: rgba(26,42,74,0.6);
      border: 2px solid rgba(201,169,110,0.4);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 2px;
    }

    .start-diff-btn:hover {
      border-color: #c9a96e;
      color: #c9a96e;
      background: rgba(201,169,110,0.1);
    }

    .start-diff-btn.active {
      background: #c9a96e;
      color: #0d1a30;
      border-color: #c9a96e;
    }

    .start-btn {
      padding: 18px 70px;
      font-size: 22px;
      font-weight: 900;
      color: #0d1a30;
      background: linear-gradient(180deg, #e8c98a 0%, #c9a96e 50%, #a8894e 100%);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 40px rgba(201,169,110,0.4), inset 0 1px 0 rgba(255,255,255,0.4);
      letter-spacing: 8px;
    }

    .start-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 50px rgba(201,169,110,0.6), inset 0 1px 0 rgba(255,255,255,0.4);
    }

    .start-btn:active {
      transform: translateY(-1px);
    }

    .start-tips {
      margin-top: 40px;
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      text-align: center;
      line-height: 2.2;
      letter-spacing: 1px;
    }

    .back-link {
      position: absolute;
      bottom: 24px;
      right: 24px;
      color: #c9a96e;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 20px;
      background: rgba(13,26,48,0.85);
      border: 1px solid rgba(201,169,110,0.4);
      border-radius: 8px;
      transition: all 0.3s ease;
      pointer-events: auto;
      letter-spacing: 1px;
    }

    .back-link:hover {
      background: #c9a96e;
      color: #0d1a30;
    }
  </style>
</head>
<body>
  <!-- 开始界面 -->
  <div class="start-screen" id="startScreen">
    <div class="olympic-rings">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
    </div>
    <h1>乒乓球决赛</h1>
    <p class="subtitle">OLYMPIC FINAL · 奥运决赛</p>
    <div class="match-info">
      <strong>男子单打决赛</strong> · 第7局决胜<br>
      你 VS 电脑 · 11分制 · 领先2分获胜 · 一方弹2次失分
    </div>
    <div class="start-difficulty" id="startDifficulty">
      <button class="start-diff-btn" data-diff="easy">铜牌赛</button>
      <button class="start-diff-btn active" data-diff="normal">银牌赛</button>
      <button class="start-diff-btn" data-diff="hard">金牌赛</button>
    </div>
    <button class="start-btn" id="startBtn">开赛</button>
    <div class="start-tips">
      移动鼠标控制球拍 · 按住鼠标蓄力，松开击球（蓄力越久力量越大）<br>
      右键切换正反手（正手红胶皮/反手黑胶皮）
      真实横握拍姿势 · 正反手切换 · 奥运决赛赛场 · 观众欢呼音效 · 乒乓球拖尾
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div class="overlay">
    <div class="scoreboard">
      <div class="score-side">
        <div class="score-label">你</div>
        <div class="score-value" id="playerScore">0</div>
      </div>
      <div class="score-divider">:</div>
      <div class="score-side">
        <div class="score-label">对手</div>
        <div class="score-value" id="aiScore">0</div>
      </div>
    </div>

    <div class="game-info">
      <h2>奥运乒乓球决赛</h2>
      <p>第一人称视角 · 真实物理模拟</p>
    </div>

    <div class="difficulty" id="difficulty">
      <button class="diff-btn" data-diff="easy">铜牌</button>
      <button class="diff-btn active" data-diff="normal">银牌</button>
      <button class="diff-btn" data-diff="hard">金牌</button>
    </div>

    <!-- 蓄力条 -->
    <div class="power-bar-container" id="powerBarContainer">
      <div class="power-bar-label">击球力度</div>
      <div class="power-bar">
        <div class="power-bar-fill" id="powerBarFill"></div>
      </div>
    </div>

    <div class="center-message" id="centerMessage">
      <h1 id="messageTitle">准备</h1>
      <p id="messageSub">按住鼠标蓄力，松开发球</p>
    </div>

    <div class="controls-hint">
      <strong>移动鼠标</strong> 控制球拍 · <strong>按住左键</strong> 蓄力 · <strong>松开</strong> 击球 · <strong>右键</strong> 切换正反手 · <strong>Esc</strong> 暂停
    </div>

    <a href="index.html" class="back-link">← 返回主页</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
  (function () {
    'use strict';

    // ===== 游戏配置 =====
    const CONFIG = {
      table: { length: 2.74, width: 1.525, height: 0.76, netHeight: 0.1525 },
      ball: { radius: 0.02, mass: 0.0027, gravity: 9.81, restitution: 0.92, airResistance: 0.1 },
      paddle: { width: 0.18, height: 0.22, thickness: 0.008 },
      game: { winScore: 11, serveInterval: 2, maxChargeTime: 1.5, deuceScore: 10 }
    };

    const DIFFICULTY = {
      easy: { aiSpeed: 0.18, aiError: 0.35, ballSpeedMult: 0.6, name: '铜牌赛' },
      normal: { aiSpeed: 0.4, aiError: 0.15, ballSpeedMult: 0.85, name: '银牌赛' },
      hard: { aiSpeed: 0.7, aiError: 0.05, ballSpeedMult: 1.05, name: '金牌赛' }
    };

    // ===== 状态 =====
    let currentDifficulty = 'normal';
    let gameState = 'waiting';
    let playerScore = 0, aiScore = 0;
    let isPlayerServing = true;
    let serveCount = 0;

    // Three.js
    let scene, camera, renderer;
    let table, net, ball, playerPaddle, aiPaddle, playerArm;
    let ballVelocity = new THREE.Vector3();
    let ballSpin = new THREE.Vector3();
    let lastHitBy = null;
    let ballBouncedOnTable = false;

    // 球台弹跳次数追踪（某一方弹跳2次即失分）
    let currentTableSide = null; // 'player' or 'ai'
    let bounceCountOnSide = 0;

    // 乒乓球拖尾
    let ballTrail = [];
    const TRAIL_LENGTH = 12;
    let trailMeshes = [];

    // 鼠标控制
    let mouseX = 0, mouseY = 0;
    let targetPaddleX = 0, targetPaddleY = 0;

    // 正反手状态
    let isForehand = true; // true=正手(红色胶皮), false=反手(黑色胶皮)
    let paddleTransition = 1; // 正反手切换过渡 0-1
    let isCelebrating = false; // 庆祝动画状态
    let celebrateTime = 0;

    // 蓄力
    let isCharging = false;
    let chargeStartTime = 0;
    let currentPower = 0;

    // 动画
    let clock = new THREE.Clock();
    let animationId = null;

    // ===== 音效系统 =====
    let audioCtx = null;
    let crowdNoiseNode = null;
    let crowdGainNode = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        initCrowdSound();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    // 观众欢呼声（白噪声+带通滤波模拟人群）
    function initCrowdSound() {
      try {
        // 创建白噪声
        const bufferSize = 2 * audioCtx.sampleRate;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }

        crowdNoiseNode = audioCtx.createBufferSource();
        crowdNoiseNode.buffer = noiseBuffer;
        crowdNoiseNode.loop = true;

        // 带通滤波模拟人群声
        const bandpass = audioCtx.createBiquadFilter();
        bandpass.type = 'bandpass';
        bandpass.frequency.value = 800;
        bandpass.Q.value = 0.5;

        // 低通滤波让声音更柔和
        const lowpass = audioCtx.createBiquadFilter();
        lowpass.type = 'lowpass';
        lowpass.frequency.value = 2000;

        crowdGainNode = audioCtx.createGain();
        crowdGainNode.gain.value = 0.04; // 基础音量

        crowdNoiseNode.connect(bandpass);
        bandpass.connect(lowpass);
        lowpass.connect(crowdGainNode);
        crowdGainNode.connect(audioCtx.destination);

        crowdNoiseNode.start();
      } catch (e) {}
    }

    // 观众欢呼强度变化
    function setCrowdIntensity(intensity) {
      if (!crowdGainNode || !audioCtx) return;
      const targetGain = 0.03 + intensity * 0.12;
      crowdGainNode.gain.setTargetAtTime(targetGain, audioCtx.currentTime, 0.3);
    }

    // 得分时的欢呼爆发
    function playCrowdCheer(isPlayerScore) {
      if (!audioCtx) return;
      try {
        // 短暂提升观众音量
        setCrowdIntensity(1);
        setTimeout(() => setCrowdIntensity(0.3), 2000);
        setTimeout(() => setCrowdIntensity(0), 4000);

        // 加一个"加油"的呼喊感（用频率调制）
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(isPlayerScore ? 400 : 300, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(isPlayerScore ? 600 : 250, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
      } catch (e) {}
    }

    // 击球音效（木质撞击声）
    function playHitSound(intensity) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        osc.type = 'square';
        const baseFreq = 700 + intensity * 500;
        osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(180, audioCtx.currentTime + 0.07);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(3500, audioCtx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.09);

        gain.gain.setValueAtTime(0.12 + intensity * 0.18, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.09);

        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.09);
      } catch (e) {}
    }

    // 球落桌音效
    function playBounceSound() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1100, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(550, audioCtx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } catch (e) {}
    }

    // ===== 场景初始化 =====
    function initScene() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a1628);
      scene.fog = new THREE.Fog(0x0a1628, 8, 25);

      // 相机 - 真实持拍人视角（人眼高度约1.2m，略微俯视球桌）
      camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.01, 100);
      camera.position.set(0, 1.15, CONFIG.table.length / 2 + 0.35);
      camera.lookAt(0, CONFIG.table.height + 0.05, -0.3);

      renderer = new THREE.WebGLRenderer({
        canvas: document.getElementById('gameCanvas'),
        antialias: true
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;

      // 灯光 - 奥运赛场聚光灯
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.35);
      scene.add(ambientLight);

      // 主聚光灯（球桌上方）
      const mainSpot = new THREE.SpotLight(0xffffff, 1.5, 15, Math.PI / 4, 0.4, 1);
      mainSpot.position.set(0, 5, 0);
      mainSpot.target.position.set(0, CONFIG.table.height, 0);
      mainSpot.castShadow = true;
      mainSpot.shadow.mapSize.width = 2048;
      mainSpot.shadow.mapSize.height = 2048;
      scene.add(mainSpot);
      scene.add(mainSpot.target);

      // 两侧辅助灯
      const fillLight1 = new THREE.PointLight(0x7EB6D9, 0.4, 10);
      fillLight1.position.set(-4, 3, 0);
      scene.add(fillLight1);

      const fillLight2 = new THREE.PointLight(0xE8787A, 0.3, 10);
      fillLight2.position.set(4, 3, 0);
      scene.add(fillLight2);

      createOlympicVenue();
      createTable();
      createNet();
      createBall();
      createPaddles();

    // 创建乒乓球
    function createBall() {
      const ballGeo = new THREE.SphereGeometry(CONFIG.ball.radius, 32, 32);
      const ballMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.25,
        metalness: 0.02
      });
      ball = new THREE.Mesh(ballGeo, ballMat);
      ball.castShadow = true;
      ball.position.set(0, CONFIG.table.height + 0.2, CONFIG.table.length / 2 - 0.2);
      scene.add(ball);

      // 创建拖尾粒子
      for (let i = 0; i < TRAIL_LENGTH; i++) {
        const trailGeo = new THREE.SphereGeometry(CONFIG.ball.radius * (1 - i / TRAIL_LENGTH * 0.7), 12, 12);
        const trailMat = new THREE.MeshBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0
        });
        const trail = new THREE.Mesh(trailGeo, trailMat);
        trail.visible = false;
        scene.add(trail);
        trailMeshes.push(trail);
      }
    }

    // 更新拖尾
    function updateTrail() {
      if (!ball) return;

      // 只有球在运动时才显示拖尾
      const speed = ballVelocity.length();
      if (speed > 0.5 && (gameState === 'playing' || gameState === 'serving')) {
        // 记录当前位置
        ballTrail.unshift(ball.position.clone());
        if (ballTrail.length > TRAIL_LENGTH) {
          ballTrail.pop();
        }

        // 更新拖尾粒子
        for (let i = 0; i < TRAIL_LENGTH; i++) {
          if (i < ballTrail.length) {
            trailMeshes[i].position.copy(ballTrail[i]);
            trailMeshes[i].visible = true;
            // 越靠后的粒子越透明、越小
            const alpha = (1 - i / TRAIL_LENGTH) * 0.5 * Math.min(1, speed / 5);
            trailMeshes[i].material.opacity = alpha;
            const scale = 1 - i / TRAIL_LENGTH * 0.6;
            trailMeshes[i].scale.setScalar(scale);
          } else {
            trailMeshes[i].visible = false;
          }
        }
      } else {
        // 球静止时隐藏拖尾并清空
        ballTrail = [];
        trailMeshes.forEach(t => t.visible = false);
      }
    }

    // 创建真实球拍（横拍）
    function createRealPaddle(isPlayer) {
      const group = new THREE.Group();

      // 拍面底板（木质）
      const bladeShape = new THREE.Shape();
      const w = CONFIG.paddle.width / 2;
      const h = CONFIG.paddle.height / 2;
      // 真实球拍形状：略圆的拍头，稍窄的拍肩
      bladeShape.moveTo(0, -h * 0.85);
      bladeShape.bezierCurveTo(w * 0.9, -h * 0.85, w, -h * 0.3, w, h * 0.2);
      bladeShape.bezierCurveTo(w, h * 0.8, w * 0.6, h, 0, h);
      bladeShape.bezierCurveTo(-w * 0.6, h, -w, h * 0.8, -w, h * 0.2);
      bladeShape.bezierCurveTo(-w, -h * 0.3, -w * 0.9, -h * 0.85, 0, -h * 0.85);

      const extrudeSettings = {
        depth: CONFIG.paddle.thickness,
        bevelEnabled: true,
        bevelThickness: 0.002,
        bevelSize: 0.002,
        bevelSegments: 2
      };
      const bladeGeo = new THREE.ExtrudeGeometry(bladeShape, extrudeSettings);
      const woodMat = new THREE.MeshStandardMaterial({
        color: 0xD4A574,
        roughness: 0.6,
        metalness: 0.05
      });
      const blade = new THREE.Mesh(bladeGeo, woodMat);
      blade.rotation.x = Math.PI / 2;
      blade.castShadow = true;
      group.add(blade);

      // 正手胶皮（红色，朝向镜头/前方）
      const rubberGeo = new THREE.ExtrudeGeometry(bladeShape, {
        depth: 0.003,
        bevelEnabled: false
      });
      const forehandMat = new THREE.MeshStandardMaterial({
        color: 0xCC2222,
        roughness: 0.8,
        metalness: 0.0
      });
      const forehandRubber = new THREE.Mesh(rubberGeo, forehandMat);
      forehandRubber.rotation.x = Math.PI / 2;
      forehandRubber.position.z = CONFIG.paddle.thickness / 2 + 0.001;
      forehandRubber.name = 'forehandRubber';
      group.add(forehandRubber);

      // 反手胶皮（黑色，朝向后方）
      const backhandMat = new THREE.MeshStandardMaterial({
        color: 0x1a1a1a,
        roughness: 0.85,
        metalness: 0.0
      });

      backhandRubber.rotation.x = Math.PI / 2;

      // 拍面边缘（木质包边）
      const edgeGeo = new THREE.TorusGeometry(w * 0.85, 0.004, 8, 32);

      edge.scale.y = h / w * 0.9;
      group.add(edge);

      // 手柄（横拍长手柄，FL收腰柄）
      const handleGeo = new THREE.CylinderGeometry(0.016, 0.024, 0.1, 12);
      const handleMat = new THREE.MeshStandardMaterial({
        color: 0x6B4423,
        roughness: 0.75
      });

      handle.position.set(0, -0.09, 0);
      handle.rotation.x = Math.PI / 2;
      handle.castShadow = true;
      group.add(handle);

      const handleEnd = new THREE.Mesh(handleEndGeo, handleMat);
      handleEnd.position.set(0, -0.145, 0);
      handleEnd.rotation.x = Math.PI / 2;
      group.add(handleEnd);

      // 手柄防滑纹理（深色环）
      for (let i = 0; i < 4; i++) {
        const gripGeo = new THREE.TorusGeometry(0.019, 0.002, 6, 16);
        const gripMat = new THREE.MeshStandardMaterial({ color: 0x3a2a1a });

      const labelGeo = new THREE.PlaneGeometry(0.04, 0.015);

      labelCtx.font = 'bold 10px sans-serif';
      labelCtx.textAlign = 'center';
      labelCtx.textBaseline = 'middle';

    // ===== 物理模拟 =====
    function updatePhysics(dt) {
      if (gameState !== 'playing' && gameState !== 'serving') return;

      ballVelocity.y -= CONFIG.ball.gravity * dt;

      const drag = Math.exp(-CONFIG.ball.airResistance * dt);
      ballVelocity.multiplyScalar(drag);

      const magnus = ballSpin.clone().multiplyScalar(0.4 * dt);
      ballVelocity.add(magnus);

      ball.position.add(ballVelocity.clone().multiplyScalar(dt));

      ball.rotation.x += ballSpin.z * dt * 15;
      ball.rotation.y += ballSpin.y * dt * 15;
      ball.rotation.z += ballSpin.x * dt * 15;

      checkTableCollision();
      checkNetCollision();
      checkPaddleCollision();
      checkOutOfBounds();
    }

    function checkTableCollision() {
      const tableTop = CONFIG.table.height + 0.025;
      const ballBottom = ball.position.y - CONFIG.ball.radius;

      if (ballBottom <= tableTop && ballVelocity.y < 0) {
        if (Math.abs(ball.position.x) <= CONFIG.table.width / 2 &&
            Math.abs(ball.position.z) <= CONFIG.table.length / 2) {

          // 判断球落在哪一方（z > 0 是玩家方，z < 0 是AI方）
          const side = ball.position.z > 0 ? 'player' : 'ai';

          // 如果换到另一方，重置弹跳计数
          if (side !== currentTableSide) {
            currentTableSide = side;
            bounceCountOnSide = 1;
          } else {
            // 同一方再次弹跳
            bounceCountOnSide++;
          }

          // 某一方弹跳2次即判该方失分
          if (bounceCountOnSide >= 2 && gameState === 'playing') {
            const loser = side;
            const scorer = loser === 'player' ? 'ai' : 'player';
            // 延迟一点再判分，让球的弹跳动画播完
            setTimeout(() => {
              if (gameState === 'playing') {
                scorePoint(scorer);
              }
            }, 300);
          }

          ball.position.y = tableTop + CONFIG.ball.radius;
          ballVelocity.y = -ballVelocity.y * CONFIG.ball.restitution;
          ballVelocity.x *= 0.94;
          ballVelocity.z *= 0.94;
          ballSpin.multiplyScalar(0.88);
          playBounceSound();
          ballBouncedOnTable = true;
        }
      }
    }

    function checkNetCollision() {
      const netZ = 0;
      const netTop = CONFIG.table.height + CONFIG.table.netHeight;

      if (Math.abs(ball.position.z - netZ) < CONFIG.ball.radius + 0.005 &&
          ball.position.y < netTop &&
          ball.position.y > CONFIG.table.height) {
        if (Math.abs(ball.position.x) <= CONFIG.table.width / 2) {
          ballVelocity.z = -ballVelocity.z * 0.4;
          ball.position.z = netZ + (ballVelocity.z > 0 ? 1 : -1) * (CONFIG.ball.radius + 0.01);
          playBounceSound();
        }
      }
    }

    function checkPaddleCollision() {
      // 玩家球拍碰撞范围放大，降低击中难度
      const playerHitRadius = CONFIG.paddle.width / 2 * 1.6 + CONFIG.ball.radius;
      if (lastHitBy !== 'player') {
        const dx = ball.position.x - playerPaddle.position.x;
        const dy = ball.position.y - playerPaddle.position.y;
        const dz = ball.position.z - playerPaddle.position.z;
        const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
        if (dist < playerHitRadius && ballVelocity.z < 0) {
          hitBall('player');
        }
      }

      if (lastHitBy !== 'ai') {
        const dx = ball.position.x - aiPaddle.position.x;
        const dy = ball.position.y - aiPaddle.position.y;
        const dz = ball.position.z - aiPaddle.position.z;
        const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
        if (dist < CONFIG.paddle.width / 2 + CONFIG.ball.radius && ballVelocity.z > 0) {
          hitBall('ai');
        }
      }
    }

    function hitBall(hitter) {
      const diff = DIFFICULTY[currentDifficulty];
      const paddle = hitter === 'player' ? playerPaddle : aiPaddle;

      const relX = (ball.position.x - paddle.position.x) / (CONFIG.paddle.width / 2);
      const relY = (ball.position.y - paddle.position.y) / (CONFIG.paddle.height / 2);

      let speed = 3 * diff.ballSpeedMult;
      if (hitter === 'player') {
        // 玩家击球：根据蓄力力度
        speed = 2 + currentPower * 5;
      }

      if (hitter === 'player') {
        ballVelocity.set(
          relX * 1.8,
          1.8 + relY * 1.8 + currentPower * 1.5,
          -speed
        );
      } else {
        const targetX = (Math.random() - 0.5) * CONFIG.table.width * 0.8;
        const error = (Math.random() - 0.5) * diff.aiError * 2;
        ballVelocity.set(
          (targetX - ball.position.x) * 0.8 + error,
          1.8 + Math.random() * 1.2,
          speed
        );
      }

      ballSpin.set(
        relY * 6,
        relX * 4,
        hitter === 'player' ? -3 - currentPower * 3 : 3
      );

      lastHitBy = hitter;
      ballBouncedOnTable = false;
      // 击球后重置弹跳计数，球飞向对方，下一次落地是对方的第一次弹跳
      currentTableSide = null;
      bounceCountOnSide = 0;

      const intensity = Math.min(1, speed / 6);
      playHitSound(intensity);
      setCrowdIntensity(0.4);
      setTimeout(() => setCrowdIntensity(0.1), 500);
    }

    function checkOutOfBounds() {
      if (ball.position.y < 0.15) {
        if (gameState === 'playing') {
          if (lastHitBy === 'player') scorePoint('ai');
          else if (lastHitBy === 'ai') scorePoint('player');
        }
        resetBall();
      }

      if (Math.abs(ball.position.x) > 4 || Math.abs(ball.position.z) > 5) {
        if (gameState === 'playing') {
          if (lastHitBy === 'player') scorePoint('ai');
          else if (lastHitBy === 'ai') scorePoint('player');
        }
        resetBall();
      }
    }

    function scorePoint(scorer) {
      if (scorer === 'player') {
        playerScore++;
        playCrowdCheer(true);
      } else {
        aiScore++;
        playCrowdCheer(false);
      }
      updateScoreDisplay();
      serveCount++;

      // 获胜判定：达到11分且领先2分
      const isDeuce = playerScore >= CONFIG.game.deuceScore && aiScore >= CONFIG.game.deuceScore;
      const playerWins = playerScore >= CONFIG.game.winScore && (playerScore - aiScore) >= 2;
      const aiWins = aiScore >= CONFIG.game.winScore && (aiScore - playerScore) >= 2;

      if (playerWins || aiWins) {
        gameState = 'gameover';
        const isWin = playerWins;
        showMessage(
          isWin ? '冠军！' : '惜败',
          isWin ? `你以 ${playerScore}:${aiScore} 赢得了奥运金牌！` : `以 ${playerScore}:${aiScore} 获得银牌，再接再厉！`
        );
        if (isWin) {
          startCelebration();
        } else {
          setCrowdIntensity(0.3);
        }
        return;
      }

      // 换发球：10平后每1分换发，否则每2分换发
      if (isDeuce) {
        isPlayerServing = !isPlayerServing;
      } else if (serveCount % CONFIG.game.serveInterval === 0) {
        isPlayerServing = !isPlayerServing;
      }

      setTimeout(() => {
        if (gameState !== 'gameover') prepareServe();
      }, 1200);
    }

    function resetBall() {
      ballVelocity.set(0, 0, 0);
      ballSpin.set(0, 0, 0);
      lastHitBy = null;
      ballBouncedOnTable = false;
      // 重置弹跳计数
      currentTableSide = null;
      bounceCountOnSide = 0;
      // 清空拖尾
      ballTrail = [];
      if (trailMeshes.length) {
        trailMeshes.forEach(t => t.visible = false);
      }
    }

    function prepareServe() {
      resetBall();
      gameState = 'serving';
      currentPower = 0;

      if (isPlayerServing) {
        ball.position.set(
          playerPaddle.position.x,
          CONFIG.table.height + 0.12,
          CONFIG.table.length / 2 - 0.15
        );
        showMessage('准备发球', '按住鼠标蓄力，松开发球');
      } else {
        ball.position.set(
          aiPaddle.position.x,
          CONFIG.table.height + 0.12,
          -CONFIG.table.length / 2 + 0.15
        );
        showMessage('对手发球', '准备接球');
        setTimeout(() => {
          if (gameState === 'serving') aiServe();
        }, 1500);
      }
    }

    function playerServe() {
      if (gameState !== 'serving' || !isPlayerServing) return;
      initAudio();

      const diff = DIFFICULTY[currentDifficulty];
      const speed = 2 + currentPower * 4;
      ballVelocity.set(
        (Math.random() - 0.5) * 0.5,
        2 + currentPower,
        -speed * diff.ballSpeedMult
      );
      ballSpin.set(0, 2 + currentPower * 2, -1 - currentPower);
      lastHitBy = 'player';
      ballBouncedOnTable = false;
      currentTableSide = null;
      bounceCountOnSide = 0;
      gameState = 'playing';
      hideMessage();
      playHitSound(0.3 + currentPower * 0.5);
      setCrowdIntensity(0.3);
      setTimeout(() => setCrowdIntensity(0.1), 300);
    }

    function aiServe() {
      if (gameState !== 'serving' || isPlayerServing) return;
      initAudio();

      const diff = DIFFICULTY[currentDifficulty];
      const targetX = (Math.random() - 0.5) * CONFIG.table.width * 0.4;
      // 降低发球速度，让玩家更容易接
      ballVelocity.set(
        (targetX - ball.position.x) * 0.4,
        2.0,
        2.0 * diff.ballSpeedMult
      );
      ballSpin.set(0, -2, 1);
      lastHitBy = 'ai';
      ballBouncedOnTable = false;
      currentTableSide = null;
      bounceCountOnSide = 0;
      gameState = 'playing';
      hideMessage();
      playHitSound(0.4);
    }

    // ===== AI =====
    function updateAI(dt) {
      if (gameState !== 'playing') return;

      const diff = DIFFICULTY[currentDifficulty];
      let targetX = ball.position.x;
      let targetY = ball.position.y;

      targetX += (Math.random() - 0.5) * diff.aiError;
      targetY += (Math.random() - 0.5) * diff.aiError * 0.5;

      targetX = Math.max(-CONFIG.table.width / 2 + 0.1, Math.min(CONFIG.table.width / 2 - 0.1, targetX));
      targetY = Math.max(CONFIG.table.height + 0.05, Math.min(CONFIG.table.height + 0.35, targetY));

      const speed = diff.aiSpeed * 3;
      aiPaddle.position.x += (targetX - aiPaddle.position.x) * Math.min(1, speed * dt);
      aiPaddle.position.y += (targetY - aiPaddle.position.y) * Math.min(1, speed * dt);

      aiPaddle.rotation.y = Math.atan2(ball.position.x - aiPaddle.position.x, 1) * 0.25;
      aiPaddle.rotation.x = 0.25 + (ball.position.y - aiPaddle.position.y) * 0.3;
    }

    // ===== 玩家控制 =====
    function updatePlayerPaddle(dt) {
      // 庆祝动画优先
      if (isCelebrating) {
        celebrateTime += dt;
        // 球拍上举挥动庆祝
        const celebrateY = CONFIG.table.height + 0.3 + Math.sin(celebrateTime * 8) * 0.1;
        const celebrateX = Math.sin(celebrateTime * 4) * 0.15;
        playerPaddle.position.x += (celebrateX - playerPaddle.position.x) * Math.min(1, 8 * dt);
        playerPaddle.position.y += (celebrateY - playerPaddle.position.y) * Math.min(1, 8 * dt);
        playerPaddle.rotation.x = -0.8 + Math.sin(celebrateTime * 6) * 0.3;
        playerPaddle.rotation.z = 0.3 + Math.sin(celebrateTime * 5) * 0.2;
        playerPaddle.rotation.y = Math.sin(celebrateTime * 3) * 0.4;
        return;
      }

      // 球拍中心跟随鼠标（鼠标位置即球拍中心）
      // 限制鼠标范围在球桌内，不会拉出屏幕
      const clampedMouseX = Math.max(-0.85, Math.min(0.85, mouseX));
      const clampedMouseY = Math.max(-0.7, Math.min(0.7, mouseY));

      // 正反手位置偏移：正手偏右，反手偏左（右手持拍）
      const handOffsetX = isForehand ? 0.05 : -0.05;
      const handOffsetY = isForehand ? 0 : 0.02;

      targetPaddleX = clampedMouseX * CONFIG.table.width * 0.5 + handOffsetX;
      targetPaddleY = CONFIG.table.height + 0.08 + clampedMouseY * 0.22 + handOffsetY;

      // 严格限制球拍范围（不拉出屏幕/球桌）
      targetPaddleX = Math.max(-CONFIG.table.width / 2 + 0.12, Math.min(CONFIG.table.width / 2 - 0.12, targetPaddleX));
      targetPaddleY = Math.max(CONFIG.table.height + 0.04, Math.min(CONFIG.table.height + 0.35, targetPaddleY));

      // 平滑跟随（更快的响应，球拍中心紧跟鼠标）
      playerPaddle.position.x += (targetPaddleX - playerPaddle.position.x) * Math.min(1, 25 * dt);
      playerPaddle.position.y += (targetPaddleY - playerPaddle.position.y) * Math.min(1, 25 * dt);

      // 正反手切换过渡动画
      const targetTransition = isForehand ? 1 : 0;
      paddleTransition += (targetTransition - paddleTransition) * Math.min(1, 10 * dt);

      // 真实握拍角度
      // 正手：拍面前倾，手腕外展，球拍稍向右
      // 反手：拍面后仰，手腕内收，球拍稍向左
      const forehandRotX = -0.35;
      const backhandRotX = -0.15;
      const forehandRotY = -0.25;
      const backhandRotY = 0.35;
      const forehandRotZ = 0.2;
      const backhandRotZ = -0.15;

      const chargeTilt = isCharging ? currentPower * 0.25 : 0;

      playerPaddle.rotation.x = forehandRotX * paddleTransition + backhandRotX * (1 - paddleTransition) - mouseY * 0.1 - chargeTilt;
      playerPaddle.rotation.y = forehandRotY * paddleTransition + backhandRotY * (1 - paddleTransition) + mouseX * 0.15;
      playerPaddle.rotation.z = forehandRotZ * paddleTransition + backhandRotZ * (1 - paddleTransition) + mouseX * 0.08;

      // 手臂跟随（正反手手臂位置不同）
      if (playerArm) {
        const armOffsetX = isForehand ? 0.1 : -0.1;
        playerArm.position.x = playerPaddle.position.x * 0.4 + armOffsetX;
        playerArm.rotation.y = playerPaddle.position.x * 0.15;
        playerArm.rotation.z = isForehand ? -0.1 : 0.1;
      }
    }

    // 切换正反手
    function toggleForehand() {
      isForehand = !isForehand;
      // 切换时播放轻微音效
      if (audioCtx) {
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(isForehand ? 600 : 500, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.08);
        } catch (e) {}
      }
    }

    // 开始庆祝动画
    function startCelebration() {
      isCelebrating = true;
      celebrateTime = 0;
      setCrowdIntensity(1);
      // 5秒后结束庆祝
      setTimeout(() => {
        isCelebrating = false;
      }, 5000);
    }

    // ===== 蓄力控制 =====
    function startCharge() {
      if (gameState === 'serving' && isPlayerServing) {
        isCharging = true;
        chargeStartTime = clock.getElapsedTime();
        document.getElementById('powerBarContainer').classList.add('active');
      } else if (gameState === 'playing' && lastHitBy !== 'player') {
        // 回合中也可以蓄力准备击球
        isCharging = true;
        chargeStartTime = clock.getElapsedTime();
        document.getElementById('powerBarContainer').classList.add('active');
      }
    }

    function releaseCharge() {
      if (!isCharging) return;
      isCharging = false;
      document.getElementById('powerBarContainer').classList.remove('active');

      const chargeTime = Math.min(clock.getElapsedTime() - chargeStartTime, CONFIG.game.maxChargeTime);
      currentPower = chargeTime / CONFIG.game.maxChargeTime;

      if (gameState === 'serving' && isPlayerServing) {
        playerServe();
      }
      // 回合中的蓄力在实际碰撞时使用 currentPower
    }

    function updatePowerBar() {
      if (isCharging) {
        const chargeTime = Math.min(clock.getElapsedTime() - chargeStartTime, CONFIG.game.maxChargeTime);
        const power = (chargeTime / CONFIG.game.maxChargeTime) * 100;
        document.getElementById('powerBarFill').style.width = power + '%';
      }
    }

    // ===== UI =====
    function updateScoreDisplay() {
      document.getElementById('playerScore').textContent = playerScore;
      document.getElementById('aiScore').textContent = aiScore;
    }

    function showMessage(title, sub) {
      document.getElementById('messageTitle').textContent = title;
      document.getElementById('messageSub').textContent = sub;
      document.getElementById('centerMessage').classList.add('show');
    }

    function hideMessage() {
      document.getElementById('centerMessage').classList.remove('show');
    }

    // ===== 游戏循环 =====
    function animate() {
      animationId = requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      if (gameState === 'playing' || gameState === 'serving') {
        updatePhysics(dt);
        updateAI(dt);
      }

      updatePlayerPaddle(dt);
      updatePowerBar();
      updateTrail();

      if (gameState === 'serving' && isPlayerServing) {
        ball.position.x = playerPaddle.position.x;
        ball.position.y = playerPaddle.position.y + 0.06;
        ball.position.z = CONFIG.table.length / 2 - 0.12;
      }

      renderer.render(scene, camera);
    }

    // ===== 事件 =====
    function initEvents() {
      document.addEventListener('mousemove', (e) => {
        mouseX = (e.clientX / window.innerWidth) * 2 - 1;
        mouseY = -((e.clientY / window.innerHeight) * 2 - 1);
      });

      // 鼠标按下开始蓄力
      document.addEventListener('mousedown', (e) => {
        if (e.button === 0) {
          initAudio();
          startCharge();
        }
      });

      // 鼠标松开击球
      document.addEventListener('mouseup', (e) => {
        if (e.button === 0) {
          releaseCharge();
        }
      });

      // 右键切换正反手
      document.addEventListener('mousedown', (e) => {
        if (e.button === 2) {
          e.preventDefault();
          initAudio();
          toggleForehand();
        }
      });

      // 禁用右键菜单
      document.addEventListener('contextmenu', (e) => {
        e.preventDefault();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (gameState === 'playing') {
            gameState = 'paused';
            showMessage('已暂停', '按 Esc 继续');
            setCrowdIntensity(0.05);
          } else if (gameState === 'paused') {
            gameState = 'playing';
            hideMessage();
            setCrowdIntensity(0.15);
          }
        }
        if (e.key === ' ' && gameState === 'gameover') {
          restartGame();
        }
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      document.getElementById('startBtn').addEventListener('click', startGame);

      document.querySelectorAll('#startDifficulty .start-diff-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#startDifficulty .start-diff-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentDifficulty = btn.dataset.diff;
          updateDifficultyButtons();
        });
      });

      document.querySelectorAll('#difficulty .diff-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          currentDifficulty = btn.dataset.diff;
          updateDifficultyButtons();
        });
      });
    }

    function updateDifficultyButtons() {
      document.querySelectorAll('#difficulty .diff-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.diff === currentDifficulty);
      });
      document.querySelectorAll('#startDifficulty .start-diff-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.diff === currentDifficulty);
      });
    }

    function startGame() {
      initAudio();
      document.getElementById('startScreen').classList.add('hidden');
      playerScore = 0;
      aiScore = 0;
      serveCount = 0;
      isPlayerServing = true;
      currentPower = 0;
      isCelebrating = false;
      celebrateTime = 0;
      isForehand = true;
      paddleTransition = 1;
      updateScoreDisplay();
      setCrowdIntensity(0.2);
      prepareServe();
    }

    function restartGame() {
      playerScore = 0;
      aiScore = 0;
      serveCount = 0;
      isPlayerServing = true;
      currentPower = 0;
      isCelebrating = false;
      celebrateTime = 0;
      isForehand = true;
      paddleTransition = 1;
      updateScoreDisplay();
      hideMessage();
      setCrowdIntensity(0.2);
      prepareServe();
    }

    function init() {
      initScene();
      initEvents();
      animate();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
